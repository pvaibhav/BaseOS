[constants]
sys = '/sysroot'

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[properties]
sys_root = sys
pkg_config_libdir = [sys + '/usr/lib/aarch64-linux-gnu/pkgconfig', sys + '/usr/share/pkgconfig']

[built-in options]
c_args = ['--sysroot=' + sys, '-mcpu=cortex-a53', '-DPANVK_DEBUG_DEFAULT="noafbc"']
cpp_args = ['--sysroot=' + sys, '-mcpu=cortex-a53']
c_link_args = ['--sysroot=' + sys]
cpp_link_args = ['--sysroot=' + sys, '-static-libstdc++', '/tmp/compat.o']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
